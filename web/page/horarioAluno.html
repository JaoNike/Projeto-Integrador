<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horário das Aulas</title>
    <!-- Funcionou desse jeito-->
    <link rel="stylesheet" href="../styles/styaluno.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Horário das Aulas</h1>
        <button id="btn-logoff" class="btn-logoff">Logoff</button>
    </header>
    <main>
        <div class="tabela-container">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Horário</th>
                            <th>Segunda</th>
                            <th>Terça</th>
                            <th>Quarta</th>
                            <th>Quinta</th>
                            <th>Sexta</th>
                        </tr>
                    </thead>
                </tbody>    
                    <tbody id="tabela-horario">
                        <!-- A tabela será preenchida pelo JavaScript -->
                    </tbody>
                </table>
            </div>
            <!-- Seção de legendas abaixo da tabela -->
            <ul class="legenda">
                <li class="legend-item">
                    <div class="legend-color" style=" background-color: #b3e5cc;"></div>
                    <span>Atividades Especiais</span>
                </li>
                <li class="legend-item">
                    <div class="legend-color" style="background-color: #ffb3b3;"></div>
                    <span>Prova</span>
                </li>
                <li class="legend-item">
                    <div class="legend-color" style="background-color: #a3cde7;"></div>
                    <span>Aulas Normais</span>
                </li>
            </ul>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Horário de Aulas</p>
    </footer>
    <script type="module" src="/web/js/funaluno.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
