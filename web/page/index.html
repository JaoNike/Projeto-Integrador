<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="../styles/styindex.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <div class="light-animation"></div>
    <div class="login-container">
        <form id="loginForm" class="form-container">
            <h1>Login</h1>
            <div>
                <img src="https://img.icons8.com/ios/50/4a90e2/user" alt="User Icon">
            </div>
            <p><a href="../page/homepage.html">Pagina inicial</a></p>
            <div>
                <input type="text" id="username" placeholder="Login">
                <input type="password" id="password" placeholder="Senha">
                <button class="button-login" type="submit">Entrar</button>
            </div>
            
            <div class="form-footer">
                <p>Não tem uma conta? Volta então <a href="../page/homepage.html">Registrar</a></p>
                <p><a href="../page/homepage.html">Esqueci minha senha</a></p>
            </div>
            
        </form>
    </div>
    <script src="../js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
