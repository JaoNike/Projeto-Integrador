<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários Escolares</title>
    <link rel="stylesheet" href="/web/styles/styprofessor.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
   
</head>
<body>
    <header class="header-container">
        <h1>Horários Escolares</h1>
        <button id="btn-logoff" class="btn-logoff" onclick="goBack()">Voltar</button>
    </header>
    <div class="container main-container">
        <h2>Horário da Semana</h2>
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th scope="col">Dia</th>
                        <th scope="col">Matéria 1</th>
                        <th scope="col">Matéria 2</th>
                        <th scope="col">Matéria 3</th>
                        <th scope="col">Matéria 4</th>
                        <th scope="col">Matéria 5</th>
                    </tr>
                </thead>
                <tbody id="scheduleTable">
                
                </tbody>
            </table>
        </div>
        <div class="message-box">
            <h3>Envia Email para alunos ja cadastrados</h3>
            <textarea id="automaticMessage" rows="4" style="width: 100%;" placeholder="Digite o aviso aqui..."></textarea>
            <button class="btn-message">Enviar emails</button>
        </div>

        <div class="email-box">
            <b><p>Enviar Link do Site para Alunos e Cadastrar-los </p></b>
            <form id="emailForm">
                <label for="email">E-mail do aluno:</label>
                <input type="email" id="email" name="email" required>
                <button type="button" class="btn-email">Enviar E-mail</button>
            </form>
            <p id="emailStatus"></p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content col-11 col-md-8 col-lg-6 mx-auto p-4">
            <h3 class="mb-4">Editar Matéria</h3>
            <form id="editForm" class="row g-3">
                <div class="col-12">
                    <label for="edit-day" class="form-label">Dia:</label>
                    <input type="text" id="edit-day" class="form-control" disabled>
                </div>
                <div class="col-12">
                    <label for="edit-subject" class="form-label">Matéria:</label>
                    <select id="edit-subject" class="form-select">
                        <!-- Opções de matérias serão adicionadas dinamicamente -->
                    </select>
                </div>
                <div class="col-12">
                    <label for="edit-professor" class="form-label">Professor:</label>
                    <input type="text" id="edit-professor" class="form-control">
                </div>
                <div class="col-12">
                    <label for="edit-room" class="form-label">Número da Sala:</label>
                    <input type="text" id="edit-room" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="edit-hours" class="form-label">Duração (horas):</label>
                    <input type="number" id="edit-hours" class="form-control" min="0">
                </div>
                <div class="col-md-6">
                    <label for="edit-minutes" class="form-label">Duração (minutos):</label>
                    <input type="number" id="edit-minutes" class="form-control" min="0" max="59">
                </div>
                <div class="col-12">
                    <label for="edit-type" class="form-label">Tipo da Aula:</label>
                    <select id="edit-type" class="form-select">
                        <option>Aulas Normais</option>
                        <option>Prova</option>
                        <option>Atividades Especiais</option>
                    </select>
                </div>
                <div class="col-12 mt-4">
                    <button type="button" class="btn btn-primary me-2" onclick="saveEdit()">Salvar</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Fechar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Animação de Salvamento -->
    <div class="saving-animation" id="savingAnimation">
        <i>&#10003;</i>
        <p>Alteração salva com sucesso!</p>
    </div>

    <!-- EmailJS SDK -->
    <script type="text/JavaScript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="/web/js/acessarDB.js"></script>
    <script type="module" src="/web/js/funprofessor.js"></script>
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
